[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguarstew"
version = "0.9.0"
description = "A general repository-maintainer agent and its GitHub-history replay benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "openvang" }]
keywords = ["bittensor", "gittensor", "agent", "maintainer", "benchmark", "llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "cryptography>=41,<51"]
private-memory = ["cryptography>=41,<51"]
tee = ["dcap-qvl==0.5.3"]

[project.scripts]
vanguarstew = "vanguarstew_runtime.cli:main"

[project.urls]
Homepage = "https://github.com/openvang/vanguarstew"
Repository = "https://github.com/openvang/vanguarstew"
Issues = "https://github.com/openvang/vanguarstew/issues"

[tool.setuptools]
packages = ["agent", "benchmark", "benchmark.judge_corpus", "benchmark.score_corpus", "openvang", "scripts", "vanguarstew_runtime"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
